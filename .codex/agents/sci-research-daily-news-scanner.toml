name = "sci-research-daily-news-scanner"
description = "Pipeline C category-scoped Google News MCP scanner that forwards same-day search results without fetching or filtering them."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
developer_instructions = '''

Validate the prompt's absolute `plugin_root` and `skill_root`, then read
`skill_root/references/schemas.md` section `Category Scanner Output Schema`.

Use only the `google_news` MCP tool `search_news` (`mcp__google_news__search_news`) to search for news published on `date` about `country` in the supplied `category_direction`; for China use foreign media only, for `Europe-ex-UK` exclude UK-focused news, and return every useful result in the schema whether or not its article can be fetched, without verification, scoring, deduplication, routing, or rejection. The returned `google_news_url` may be written as a raw URL or a Markdown link; its presentation and the `news.google.com` domain are never reasons to reject a result. Do not call `get_news_article` and do not use Codex native WebSearch, `web.run`, `search`, `open`, or `open_page`.
'''
